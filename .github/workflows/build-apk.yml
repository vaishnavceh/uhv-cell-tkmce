name: Build Android Scanner APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            platforms;android-35
            build-tools;34.0.0
            build-tools;35.0.0

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: |
          npm install

      - name: Run Expo Prebuild
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Downloadable APK
        run: |
          mkdir -p output
          find apps/mobile/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output/UHV-Ticket-Scanner.apk \;
          ls -la output/

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UHV-Ticket-Scanner-Android-APK
          path: output/UHV-Ticket-Scanner.apk
          retention-days: 30
