services:
  postgres:
    image: postgres:16-alpine
    container_name: uhv_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uhv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uhv_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-uhv_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uhv_user} -d ${POSTGRES_DB:-uhv_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uhv_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: uhv_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uhv_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    container_name: uhv_backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://uhv_user:uhv_secure_pass_2026@postgres:5432/uhv_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-uhv_jwt_access_secret_key_random_long_string_tkmce_2026}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-uhv_jwt_refresh_secret_key_random_long_string_tkmce_2026}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80,http://localhost:5173}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-26214400}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tkmce.ac.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-UHV_Tkmce@2026}
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - ./packages:/app/packages
      - ./prisma:/app/prisma
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uhv_network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: uhv_frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_APP_TITLE: "Universal Human Values Cell - TKMCE"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - ./packages:/app/packages
    depends_on:
      - backend
    networks:
      - uhv_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: uhv_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - uhv_network
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: uhv_adminer
    profiles:
      - tools
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - uhv_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  uhv_network:
    driver: bridge
