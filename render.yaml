services:
  - type: web
    name: uhv-cell-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@uhv/shared-types && npx prisma generate && cd apps/api && npm install && npm run build
    startCommand: npx prisma db push && npx tsc prisma/seed.ts --target es2022 --module commonjs --skipLibCheck && node prisma/seed.js && cd apps/api && npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: uhv-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_EMAIL
        value: admin@tkmce.ac.in
      - key: ADMIN_PASSWORD
        value: UHV_Tkmce@2026

databases:
  - name: uhv-db
    plan: free
    databaseName: uhv_db
    user: uhv_user
